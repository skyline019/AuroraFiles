    <title>极光文件 Aurora Files · Windows 上的苹果风文件管理器</title>
    <style>
      html, body { height: 100%; margin: 0; background: #e3e9f4; }
      #aurora-splash {
        display: flex; height: 100%; align-items: center; justify-content: center;
        flex-direction: column; gap: 10px; font: 500 15px/1.4 system-ui, sans-serif;
        color: #5b6577; user-select: none;

      #aurora-splash .mark {
        width: 44px; height: 36px; border-radius: 8px;

  <body>
    <div id="root">
      <div id="aurora-splash" aria-busy="true" aria-label="正在启动">
        <div class="mark" aria-hidden="true"></div>
