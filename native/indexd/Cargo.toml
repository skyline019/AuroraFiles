[package]
name = "aurora-indexd"
version = "0.1.0"
edition = "2021"
description = "Resident compact file index daemon — entries stay out of V8"

[[bin]]
name = "aurora-indexd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
